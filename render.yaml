# Blueprint do Render: New → Blueprint → este repositório.
# Os valores marcados com sync: false são pedidos na criação e nunca ficam no Git.
services:
  - type: web
    name: vortex-claro
    runtime: python
    plan: free
    region: virginia
    rootDir: backend
    # A interface já vai compilada em frontend/dist, servida pelo próprio FastAPI.
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: AMBIENTE
        value: producao
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: CHAVE_REFERENCIA
        generateValue: true
